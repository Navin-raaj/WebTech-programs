<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation-4</title>
    <style>
        *{
            margin: 0;
        }
        .wrapper{
            height: 100vh;
            width: 100%;
            background-color: gainsboro;
            display: flex;
            flex-wrap: wrap;
            align-content: space-evenly;
        }

        .wrapper .top,.bottom{
            height: 50px;
            width: 100%;
            /* background-color: aqua; */
        }

        .wrapper .block{
            height: 100%;
            width: 200px;
            background: url(https://img.magnific.com/free-photo/background-made-from-bricks_23-2148742475.jpg?semt=ais_hybrid&w=740&q=80);
            background-size: cover;

        }

        .top,.bottom{
            display: flex;
            justify-content: space-evenly;
            align-items: center;
        }

        .bottom{
            justify-content: space-between;
        }

        img{
            position: absolute;
            width: 130px;
            animation: bounce 4s linear forwards infinite;
        }

        @keyframes bounce {
            0%{
                left: -200px;
                top: 0;
            }

            12%{
                left: 50px;
                top: 386px;
                
            }

            24%{
                left: 260px;
                top: 259px;


            }

            36%{
                top: 386px;
                left: 500px;

            }

            48%{
                top: 259px;
                left: 700px;
            }
            
            60%{
                top: 386px;
                left: 940px;
            }

            72%{
                top: 259px;
                left: 1160px;
            }

            84%{
                top: 386px;
                left: 1380px;
                
                /* animation-play-state: paused; */
            }

            100%{
                left: 1500px;
                top: 280px;
                transform: rotate(660deg);
            }
        }


    </style>
</head>
<body>
    <div class="wrapper">
        <img src="https://png.pngtree.com/png-vector/20230912/ourmid/pngtree-basketball-ball-object-isolated-png-image_10023404.png" alt="">
        <div class="top">
            <div class="block"></div>
            <div class="block"></div>
            <div class="block"></div>
        </div>
        <div class="bottom">
            <div class="block"></div>
            <div class="block"></div>
            <div class="block"></div>
            <div class="block"></div>
        </div>
    </div>
</body>
</html>
