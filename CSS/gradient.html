```<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient</title>
</head>
<body>
    <!-- 
        Gradient
        * Combining 2 or more colors smoothly
        * Types
            1. Linear
            2. Radial
            3. Conic
    -->

    <!-- 1. Linear Gradient -->
    <style>
        div{
            height: 75vh;
            width: 75%;
            margin: auto;
            margin-top: 7%;
            margin-bottom: 14%;
        }
        .lg{
            background-image: linear-gradient(90deg, cyan,blueviolet);
        }
    </style>
    <div class="lg"></div>

    <!-- 2. Radial Gradient -->
    <style>
        .rg{
            background-image: radial-gradient(circle, cyan, magenta, indigo);
            border-radius: 50%;
            width: 75vh;
        }
    </style>
    <div class="rg"></div>

    <style>
        .sphere{
            height: 250px;
            width: 250px;
            background-image: radial-gradient(circle farthest-side at 30% 25%, white, black);
            border-radius: 50%;
            box-shadow: 50px 70px 9px rgba(128, 128, 128, 0.799);
        }
    </style>
    <div class="sphere"></div>

    <!-- 3. Conic Gradient -->
    <style>
        .cg{
            width: 75vh;
            background-image: conic-gradient(yellow,red,lime,magenta,gold,indigo,lavender,orange,lightskyblue,chocolate,yellow);
            border-radius: 50%;

        }
        .cg2{
            width: 75vh;
            background-image: conic-gradient(yellow 0deg 40deg,red 40deg 80deg,lime 80deg 120deg,magenta 120deg 160deg,gold 160deg 200deg,indigo 200deg 240deg,lavender 240deg 280deg,orange 280deg 320deg,lightskyblue 320deg 360deg);
            border-radius: 50%;
        }
        @keyframes rotate {
            to{
                transform: rotate(360deg);
            }
        }
    </style>
    <div class="cg"></div>
    <div class="cg2"></div>
</body>
</html>
