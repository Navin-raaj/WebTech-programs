<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display</title>
    <style>
        h1{
            background-color: aqua;
            height: 30vh;
            width: 50%;
            margin: 30px;
            padding: 30px;
        }

        input{
            /* Input is inine in nature we are manually changing it to block */
            display: block;
            margin-top: 10px;
        }

        input[type="button"]{
            height: 27px;
            width: 80px;;
            padding: 9px;
            padding-left: 100px;
        }
        img{
            width: 300px;
        }

        h2{
            display: inline;
            margin: 10px;
            padding: 5px;
            background-color: aqua;
        }

        /* Inline block */
        h3{
            font-size: 3rem;
            background-color: burlywood;
            height: 100px;
            width: 750px;
            display: inline-block;
            
        }

        .none{
            height: 300px;
            width: 300px;
            background-color: aqua;
            visibility: hidden;
            /* display: none; */
        }
    </style>
</head>
<body>
    <!-- 
        Display:
            It determines the behaviour of the html elements when it is rendered in the browser.
            Types:
                1.Block :   
                    * It is default property foe few elements.
                    * It consumes whole width of the window/parent element.
                    * Always start with new line.
                    * Can apply height and width.
                    * Accept margin and padding.
                    * Eg : heading,div,nav,aside,footer,article,list items,main.
                2.Inline : 
                    * Displays the element in same line side by side.
                    * Its also default for few elements.
                    * does not start with new line.
                    * Consume the space surrounding to element.
                    * margin and padding only works with respect to the horizontal line and not with respect to vertical line.
                    * Example : a,all character formatting tags,from elements,img,audio,video,etc...
                3.Inline-block : 
                    * It displays the elements side by side.
                    * Heigth and width has effects.
                4.none : 
                    *Element will be eliminated from the browser screen.
                    * will have no other properties it just erases the element from the browser.
                    4.1 Alternative method :
                        -visibility:hidden // It will make the element transparent. it will still be in the browser but wont be visible.
                5.flex : 
                    *Stands for flexible box.
                    * Makes an HTML element as inline level block container, it wont allow any element to come out from it.
                    * Creates an relationship of parent and child among elements.
                    * The outer box inside which element will be displayed is known as "Flex-box/parent" and the inside items are known as "flex-item/child".
                    * Handle the HTML element either row-wise or column-wise hence it is called one-directional.
                    * It allows the developer to allignments,spacing,directions to make web page as responsive.
                    * Mainly used in navigation bar and product card.
                6.grid : 
                    * 
    -->
    <h1>This is a block element</h1>
    <h1>This is a block element</h1>
    <input type="text" name="" id="">
    <input type="password" name="" id="">
    <input type="button" value="sub"><br><br>
    <img src="https://cdn.pixabay.com/photo/2024/07/13/07/40/cars-8891625_1280.jpg" alt="">
    <img src="https://images.unsplash.com/photo-1628519592419-bf288f08cef5?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Nnx8c3BvcnRzJTIwY2FyfGVufDB8fDB8fHww" alt="">
    <h2>Line one</h2>
    <h2>Line two</h2>

    <h3>Jspiders</h3>
    <h3>BTM Layout</h3>

    <div class="none">
        <p>This element will be eleminated by using none</p>
    </div>
    
</body>
</html>
