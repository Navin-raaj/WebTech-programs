<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transform</title>
    <style>
        .wrap{
            height: 100vh;
            width: 100%;
            display: grid;
            place-items: center;
        }

        .box{
            height: 350px;
            width: 350px;
            background-color: cadetblue;
            /* border: 2px black solid; */
            box-shadow: 0px 0px 10px 10px black inset;
            transition: all 3s linear;
            
        }
        .box:hover{
            /* transform: rotateX(360deg);
            transform: rotateY(360deg);
            transform: rotateZ(360deg);
            transform: rotateX(360deg) rotateY(360deg) rotateZ(360deg); */

            /* transform-origin: top left; //serves as the center point for the rotation */

            /* scale */
            /* transform: scale(0.8); //when scale is less than 1 the element will shrink and if greater than 1 it will expand. 
            We can use it with repect to x axis and y axis seperately
            */
            /* transform: scaleX(1.1);
            transform: scaleY(0.8); */

            /* skew */
            /* transform: skew(15deg);
            transform: skewX(10deg);
            transform: scaleY(10deg); 
            transform-origin: left; */

            /* translate -- drags the element with respect to x and y axis px or % is to be given.*/
            /* transform: translateX(-50px);  */
            /* If px given in negative then it will move in the left direction */

            transform: skewX(-10deg);
            transform: scaleY(10deg);
            transform-origin: left;

        }
        h1{
            font-size: 15rem;
            /* text-align: center; */
            display: inline-block;
            transition: all 3s linear;
            
        }
        h1:hover{
            transform: rotateY(360deg);
            
        }
    </style>
</head>
<body>
    <!-- 
        Transform

    * Used to rotate,resize, bend and drag an HTML element.
    Properties : 
        1.rotate(deg) -Rotates: x,y,z axis.
        2.scale(num) -Resize: x,y axis.
        3.skew(deg) -Bend: x,y axis.
        4.translate(px/%) -Drag: x,y axis.
    -->
    <div class="wrap">
        <div class="box"></div>
    </div>
    <h1>J</h1>
</body>
</html>
