<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation 3</title>
    <style>

        .wrap{
            height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        img{
            width: 15%;
            animation: speed 3s forwards;
            position: relative;
        }
        @keyframes speed {
            from{
                left: 0;
            }
            to{
               left: 1300px;
            }
            
        }
        img:nth-child(1){
            animation-timing-function: linear;
        }
        img:nth-child(2){
            animation-timing-function: ease;
        }
        img:nth-child(3){
            animation-timing-function: ease-in;
        }
        img:nth-child(4){
            animation-timing-function: ease-out;
        }
        img:nth-child(5){
            animation-timing-function: ease-in-out;
        }
        img:nth-child(6){
            animation-timing-function: steps(10);
        }
    </style>
</head>
<body>
    <div class="wrap">
        <img src="https://cdn.dribbble.com/userupload/42338664/file/original-d694603179a89d3a8accc7b38f37efe2.gif" alt="">
        <img src="https://cdn.dribbble.com/userupload/42338664/file/original-d694603179a89d3a8accc7b38f37efe2.gif" alt="">
        <img src="https://cdn.dribbble.com/userupload/42338664/file/original-d694603179a89d3a8accc7b38f37efe2.gif" alt="">
        <img src="https://cdn.dribbble.com/userupload/42338664/file/original-d694603179a89d3a8accc7b38f37efe2.gif" alt="">
        <img src="https://cdn.dribbble.com/userupload/42338664/file/original-d694603179a89d3a8accc7b38f37efe2.gif" alt="">
        <img src="https://cdn.dribbble.com/userupload/42338664/file/original-d694603179a89d3a8accc7b38f37efe2.gif" alt="">

    </div>
</body>
</html>
