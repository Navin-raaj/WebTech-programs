<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation2</title>
    <style>
        .layout{
            height: 100vh;
            width: 60%;
            margin: auto;
            /* background-color: black; */
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            gap: 20px;
            place-items: center;

        }
        .box{
            height: 90%;
            width: 90%;
            background-color: gainsboro;
            display: flex;
            justify-content: center;
            align-items: center;
            visibility: hidden;
            font-size: 2rem;
            box-shadow: 0px 0px 20px 10px black inset;
            

        }
        .box:nth-child(1), .box:nth-child(2){
            animation: drag 2s linear forwards;
        }
        @keyframes drag {
            from{
                transform: translateX(-600px);

            }
            to{
                transform: translateX(0);
                visibility: visible;
            }
            
        }

        .box:nth-child(3), .box:nth-child(4){
            animation: drag2 2s linear 2100ms forwards;
        }
         @keyframes drag2 {
            from{
                transform: translateX(600px);

            }
            to{
                transform: translateX(0);
                visibility: visible;
            }
            
        }

        .box:nth-child(5), .box:nth-child(6){
            animation: drag 2s linear 4100ms forwards;
        }
    </style>
</head>
<body>
    <div class="layout">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
    </div>
</body>
</html>
