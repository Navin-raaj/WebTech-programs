<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login form</title>
</head>
<body >
    <form action="https://navin-raaj.github.io" target="_blank">
        <fieldset style="width: 20%;">
            <legend>Login</legend>
            <label for="uName">Username : </label>
            <input autofocus type="text" id="uName" required><br><br>
            <label for="Upass">Enter password : </label>
            <input type="password" name="" id="Upass" required><br><br>
            <input type="checkbox" name="" id="sPass">
            <label for="sPass">Show Password</label>
            <br><br>
            <input type="submit" value="Login">
            <input type="button" value="Cancel">
            <p>Forgot password? <a href="reset.html" target="_blank">reset</a> here</p>
            <p>New user? <a href="sign_up.html" target="_blank">Sign Up</a></p>
        </fieldset>
    </form>

</body>
</html>
