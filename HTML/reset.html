<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resest password</title>
</head>
<body>
    <form action="login.html" target="_blank">
        <fieldset style="width: 30%;">
            <legend>
                Reset Password
            </legend>
             <label for="uEmail"> Enter your email : </label>
            <input type="text" id="uEmail" required>
            <button>Get OTP</button><br><br>
            <label for="otp">Enter OTP</label>
            <input type="text" id="otp" required><br><br>
            <label for="uPassword">Enter New password : </label>
            <input type="password" id="uPassword" required><br><br>
            <label for="cPassword">Confirm Password : </label>
            <input type="password" name="" id="cPassword" required><br><br>
            <input type="submit" value="Reset">
            <a href="login.html"><input type="button" value="Cancel"></a>
        </fieldset>
       
    </form>
</body>
</html>
