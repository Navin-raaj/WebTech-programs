<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>
</head>
<body>
    <form action="login.html" target="_blank">
        <fieldset style="width: 30%;">
            <legend>Sign Up</legend>
            <label for="name">Enter name : </label>
            <input type="text" id="name" required autofocus><br><br>
            <label for="uEmail">Enter your email : </label>
            <input type="email" required><br><br>
            <label for="uName">Enter username : </label>
            <input type="text" id="uName" required><br><br>
            <label for="uPassword">Create password : </label>
            <input type="password" id="uPassword" required><br><br>
            <label for="cPassword">Confirm Password : </label>
            <input type="password" name="" id="cPassword" required><br><br>
            <input type="submit" value="Sign up">
            <a href="login.html"><input type="button" value="Cancel"></a>

        </fieldset>
       
    </form>
</body>
</html>
